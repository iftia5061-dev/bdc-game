<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BDC Network - Official</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-adbox.js"></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #070a13; --card: #151a28; --gray: #a0a5b1; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; align-items: center; background: var(--card); border-bottom: 1px solid #2d3343; }
        .balance-card { text-align: center; margin: 20px 0; }
        .coin-amount { font-size: 35px; font-weight: 800; color: white; }
        
        .main-tap { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .coin-btn { width: 210px; height: 210px; background: radial-gradient(circle, var(--gold) 0%, #b38600 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 85px; box-shadow: 0 0 40px rgba(243, 186, 47, 0.3); cursor: pointer; border: 8px solid #1c212e; transition: transform 0.05s; -webkit-tap-highlight-color: transparent; }
        .coin-btn:active { transform: scale(0.92); }

        .progress-box { width: 85%; margin: 20px 0; }
        .bar-bg { width: 100%; height: 12px; background: #242935; border-radius: 10px; overflow: hidden; }
        #bar-fill { width: 100%; height: 100%; background: var(--gold); transition: width 0.2s; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .close-btn { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 20px; cursor: pointer; }
        
        .nav { background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d3343; }
        .nav-item { text-align: center; color: var(--gray); font-size: 11px; cursor: pointer; flex: 1; }
        .nav-item.active { color: var(--gold); }

        .card-item { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d3343; }
        .ad-btn { background: #4caf50; color: white; width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-bottom: 20px; cursor: pointer; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="header">
        <div style="color:var(--gold); font-weight:bold" id="user-display">Hi, Player</div>
        <button style="background:var(--card); border:1px solid #333; color:white; padding:5px 12px; border-radius:5px" onclick="showPage('profile-page')">👤 Profile</button>
    </div>

    <div class="balance-card">
        <div style="font-size:14px; color:var(--gray)">BDC Balance</div>
        <div class="coin-amount" id="coin-count">0</div>
    </div>

    <div class="main-tap">
        <div class="coin-btn" id="tap-btn">₿</div>
        <div id="level-display" style="margin-top:15px; color:var(--gold); font-weight:bold">Level 1</div>
        <div class="progress-box">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px">
                <span>⚡ <span id="energy-val">500</span>/500</span>
                <span>Bronze Rank</span>
            </div>
            <div class="bar-bg"><div id="bar-fill"></div></div>
        </div>
    </div>

    <div id="profile-page" class="overlay">
        <button class="close-btn" onclick="closeAll()">Close</button>
        <h2 style="text-align:center">User Account</h2>
        <div class="card-item">
            <div id="p-details">Loading Profile Data...</div>
        </div>
        <button class="ad-btn" style="background:var(--gold); color:black" onclick="invite()">🔗 Invite Friends</button>
    </div>

    <div id="task-page" class="overlay">
        <button class="close-btn" onclick="closeAll()">Close</button>
        <h2 style="text-align:center">Earn Rewards</h2>
        <button class="ad-btn" onclick="showAd()">📺 Watch Ad (+5,000 BDC)</button>
        
        <div class="card-item">
            <div><b>Daily Bonus</b><br><small style="color:var(--gold)">+1,000 BDC</small></div>
            <button style="background:var(--gold); border:none; padding:8px 15px; border-radius:6px; font-weight:bold" onclick="claimDaily()">Claim</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="closeAll()">🏠 Home</div>
        <div class="nav-item" onclick="showPage('task-page')">📋 Tasks</div>
        <div class="nav-item" onclick="upgrade()">🚀 Boost</div>
        <div class="nav-item" onclick="alert('Coming Soon!')">🎁 Airdrop</div>
    </div>

    <script>
        // --- Adsgram Setup with New ID ---
        const AdController = window.Adsgram?.init({ blockId: "22105" });

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyD3vuw74WjiWytZMbVrtNzn7igIyjRMC1c",
            authDomain: "bdc-network.firebaseapp.com",
            databaseURL: "https://bdc-network-default-rtdb.firebaseio.com",
            projectId: "bdc-network",
            storageBucket: "bdc-network.firebasestorage.app",
            appId: "1:897735329291:web:0edde171fbf812e9cf290e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const tg = window.Telegram.WebApp;
        tg.expand();

        const uid = tg.initDataUnsafe?.user?.id || "guest_" + Math.floor(Math.random()*999);
        const uName = tg.initDataUnsafe?.user?.first_name || "Player";

        let balance = 0; let energy = 500; let level = 1;

        // Data Load
        db.ref('users/' + uid).on('value', (snap) => {
            if(snap.exists()){
                const d = snap.val();
                balance = d.balance || 0;
                level = d.level || 1;
                updateUI();
            } else {
                db.ref('users/' + uid).set({ name: uName, balance: 1000, level: 1 });
            }
        });

        function updateUI() {
            document.getElementById("coin-count").innerText = Math.floor(balance).toLocaleString();
            document.getElementById("energy-val").innerText = energy;
            document.getElementById("bar-fill").style.width = (energy / 500) * 100 + "%";
            document.getElementById("user-display").innerText = "Hi, " + uName;
            document.getElementById("level-display").innerText = `Level: ${level}`;
            document.getElementById("p-details").innerHTML = `<b>Name:</b> ${uName}<br><b>ID:</b> ${uid}<br><b>Balance:</b> ${Math.floor(balance)}`;
        }

        // Tap Logic
        document.getElementById("tap-btn").addEventListener("touchstart", (e) => {
            e.preventDefault();
            if(energy >= level) {
                balance += level; energy -= level;
                updateUI();
                db.ref('users/' + uid).update({ balance: balance });
            }
        });

        // Ad Logic
        function showAd() {
            if (AdController) {
                AdController.show().then(() => {
                    balance += 5000;
                    db.ref('users/' + uid).update({ balance: balance });
                    tg.showAlert("Reward: 5,000 BDC added!");
                }).catch(() => tg.showAlert("Ad not ready. Try again in 10 seconds."));
            }
        }

        function upgrade() {
            let cost = level * 1200;
            if(balance >= cost) {
                balance -= cost; level++;
                db.ref('users/' + uid).update({ balance: balance, level: level });
                tg.showAlert("Level Upgraded!");
            } else { tg.showAlert("Need " + cost + " BDC!"); }
        }

        function claimDaily() {
            const last = localStorage.getItem("bdc_d") || 0;
            const now = Date.now();
            if (now - last > 86400000) {
                balance += 1000;
                localStorage.setItem("bdc_d", now);
                db.ref('users/' + uid).update({ balance: balance });
                tg.showAlert("Daily Bonus Received!");
            } else { tg.showAlert("Come back tomorrow!"); }
        }

        function showPage(id) { document.getElementById(id).style.display = 'block'; }
        function closeAll() { document.querySelectorAll('.overlay').forEach(p => p.style.display='none'); }
        
        function invite() {
            const link = `https://t.me/my_earning_test_bot?start=${uid}`;
            tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=Join BDC Network!`);
        }

        setInterval(() => { if(energy < 500) { energy++; updateUI(); } }, 1500);
    </script>
</body>
</html>
