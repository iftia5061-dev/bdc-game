<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BDC Network - Earn & Tap</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-adbox.js"></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #070a13; --card: #151a28; --gray: #a0a5b1; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; height: 100vh; overflow: hidden; }
        
        .header { display: flex; justify-content: space-between; padding: 15px; background: var(--card); border-bottom: 2px solid #1c212e; }
        .main-tap { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 60vh; }
        
        .coin-btn { 
            width: 200px; height: 200px; 
            background: radial-gradient(circle, var(--gold) 0%, #b38600 100%); 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            font-size: 80px; box-shadow: 0 0 40px rgba(243, 186, 47, 0.3); 
            cursor: pointer; border: 8px solid #1c212e; transition: transform 0.05s; user-select: none; 
        }
        .coin-btn:active { transform: scale(0.92); }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 100; padding: 20px; box-sizing: border-box; }
        .close-btn { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 20px; }
        
        .nav { position: fixed; bottom: 0; width: 100%; background: var(--card); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #2d3343; }
        .nav-item { text-align: center; color: var(--gray); font-size: 12px; cursor: pointer; }
        
        .ad-banner { 
            background: linear-gradient(90deg, #4caf50, #2e7d32); color: white; 
            width: 100%; padding: 18px; border-radius: 12px; border: none; 
            font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px;
        }
        .info-card { background: var(--card); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #2d3343; }
    </style>
</head>
<body>

    <div class="header">
        <div style="color:var(--gold)">👤 <span id="user-name">Loading...</span></div>
        <div id="coin-count" style="font-weight:bold;">BDC: 0</div>
    </div>

    <div class="main-tap">
        <div class="coin-btn" id="tap-btn">₿</div>
        <div style="margin-top:20px; font-size:18px; color:var(--gold)">⚡ Energy: <span id="energy">500</span>/500</div>
    </div>

    <div id="earn-page" class="overlay">
        <button class="close-btn" onclick="closePage()">Back to Game</button>
        <h2>💰 Earn More BDC</h2>
        <div class="info-card">
            <p>বিজ্ঞাপন দেখুন এবং প্রতিবার ৫,০০০ কয়েন ইনকাম করুন!</p>
            <button class="ad-banner" onclick="showAd()">📺 Watch Video Ad</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item" onclick="location.reload()">🏠<br>Home</div>
        <div class="nav-item" onclick="openPage('earn-page')">💰<br>Earn</div>
    </div>

    <script>
        // --- Adsgram Initialization ---
        // আপনার দেওয়া Block ID: 22077 এখানে বসানো হয়েছে
        const AdController = window.Adsgram?.init({ blockId: "22077" });

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyD3vuw74WjiWytZMbVrtNzn7igIyjRMC1c",
            authDomain: "bdc-network.firebaseapp.com",
            databaseURL: "https://bdc-network-default-rtdb.firebaseio.com",
            projectId: "bdc-network",
            storageBucket: "bdc-network.firebasestorage.app",
            appId: "1:897735329291:web:0edde171fbf812e9cf290e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- Telegram Data ---
        const tg = window.Telegram.WebApp;
        tg.expand();
        const user = tg.initDataUnsafe?.user;
        const userId = user?.id || "guest_user";
        const name = user?.first_name || "Player";

        document.getElementById("user-name").innerText = name;

        let balance = 0;
        let energy = 500;

        // Load Data from Firebase
        db.ref('users/' + userId).on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                balance = data.balance;
                document.getElementById("coin-count").innerText = "BDC: " + balance.toLocaleString();
            } else {
                db.ref('users/' + userId).set({ name: name, balance: 0 });
            }
        });

        // Tap Logic
        document.getElementById("tap-btn").addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                updateUI();
                db.ref('users/' + userId).update({ balance: balance });
            }
        });

        // Ad Logic (The Money Maker)
        function showAd() {
            if (AdController) {
                AdController.show().then(() => {
                    // বিজ্ঞাপন দেখা শেষ হলে পুরস্কার
                    balance += 5000;
                    db.ref('users/' + userId).update({ balance: balance });
                    alert("অভিনন্দন! আপনি ৫,০০০ BDC পেয়েছেন।");
                }).catch((err) => {
                    alert("এই মুহূর্তে বিজ্ঞাপন নেই। একটু পর চেষ্টা করুন।");
                });
            } else {
                alert("Ad System loading... Please wait.");
            }
        }

        function updateUI() {
            document.getElementById("coin-count").innerText = "BDC: " + balance.toLocaleString();
            document.getElementById("energy").innerText = energy;
        }

        function openPage(id) { document.getElementById(id).style.display = "block"; }
        function closePage() { document.querySelectorAll('.overlay').forEach(p => p.style.display = 'none'); }

        // Energy Refill
        setInterval(() => {
            if (energy < 500) {
                energy += 1;
                document.getElementById("energy").innerText = energy;
            }
        }, 2000);
    </script>
</body>
</html>
