<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BDC Network - Earn & Tap</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram-adbox.js"></script>

    <style>
        :root { --gold: #f3ba2f; --dark: #070a13; --card: #151a28; --gray: #a0a5b1; --green: #4caf50; }
        body { background: var(--dark); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
        
        .ad-bar { height: 45px; background: #1c212e; display: flex; align-items: center; justify-content: center; font-size: 11px; border-bottom: 1px solid #2d3343; color: var(--gold); font-weight: bold; }
        .header { display: flex; justify-content: space-between; padding: 15px; align-items: center; }
        .coin-amount { font-size: 35px; font-weight: 800; color: white; text-align: center; margin-top: 10px; }
        
        .main-tap { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .coin-btn { width: 200px; height: 200px; background: radial-gradient(circle, var(--gold) 0%, #b38600 100%); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 80px; box-shadow: 0 0 40px rgba(243, 186, 47, 0.3); cursor: pointer; border: 8px solid #1c212e; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.92); }

        .progress-box { width: 80%; margin: 20px 0; }
        .bar-bg { width: 100%; height: 12px; background: #242935; border-radius: 10px; overflow: hidden; }
        #bar-fill { width: 100%; height: 100%; background: var(--gold); transition: width 0.3s; }

        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark); z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        .close-btn { background: var(--gold); color: black; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; margin-bottom: 20px; cursor: pointer; }
        
        .nav { background: var(--card); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #2d3343; }
        .nav-item { text-align: center; color: var(--gray); font-size: 11px; cursor: pointer; flex: 1; }

        .task-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d3343; }
        .btn-claim { background: var(--gold); color: black; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .ad-btn { background: linear-gradient(90deg, #4caf50, #2e7d32); color: white; width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: bold; margin-bottom: 15px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="ad-bar">BDC NETWORK - MINING LIVE 🚀</div>

    <div class="header">
        <div style="color:var(--gold); font-weight:bold" id="user-name">Loading...</div>
        <button style="background:var(--card); border:1px solid #333; color:white; padding:5px 10px; border-radius:5px" onclick="showReferral()">🔗 Invite</button>
    </div>

    <div class="coin-amount">BDC - <span id="coin-count">0</span></div>

    <div class="main-tap">
        <div class="coin-btn" id="tap-btn">₿</div>
        <div id="level-display" style="margin-top:15px; color:var(--gold); font-weight:bold">Level: 1</div>
        <div class="progress-box">
            <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px">
                <span>⚡ <span id="energy-val">500</span>/500</span>
                <span>Bronze Rank</span>
            </div>
            <div class="bar-bg"><div id="bar-fill"></div></div>
        </div>
    </div>

    <div id="task-page" class="overlay">
        <button class="close-btn" onclick="closePages()">Back to Mining</button>
        <h2 style="text-align:center">💰 Earn Extra BDC</h2>
        
        <button class="ad-btn" onclick="showAd()">📺 Watch Ad (+5,000 BDC)</button>

        <div class="task-card">
            <div><b>Subscribe YouTube</b><br><small style="color:var(--gold)">+10,000 BDC</small></div>
            <button class="btn-claim" onclick="doTask('https://www.youtube.com/@BDC-coin-n3z', 10000, 'yt')">Go</button>
        </div>
        <div class="task-card">
            <div><b>Join Telegram</b><br><small style="color:var(--gold)">+5,000 BDC</small></div>
            <button class="btn-claim" onclick="doTask('https://t.me/your_channel', 5000, 'tg')">Go</button>
        </div>
        <div class="task-card">
            <div><b>Follow Twitter (X)</b><br><small style="color:var(--gold)">+5,000 BDC</small></div>
            <button class="btn-claim" onclick="doTask('https://twitter.com/your_handle', 5000, 'tw')">Go</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item" onclick="openPage('task-page')">📋 Tasks</div>
        <div class="nav-item" onclick="upgradeLevel()">🚀 Boost</div>
        <div class="nav-item" id="daily-btn">📅 Daily</div>
        <div class="nav-item" onclick="alert('Coming Soon!')">🏆 Leader</div>
    </div>

    <script>
        // --- 1. CONFIG & ADS ---
        const AdController = window.Adsgram?.init({ blockId: "22077" });

        const firebaseConfig = {
            apiKey: "AIzaSyD3vuw74WjiWytZMbVrtNzn7igIyjRMC1c",
            authDomain: "bdc-network.firebaseapp.com",
            databaseURL: "https://bdc-network-default-rtdb.firebaseio.com",
            projectId: "bdc-network",
            storageBucket: "bdc-network.firebasestorage.app",
            appId: "1:897735329291:web:0edde171fbf812e9cf290e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- 2. TELEGRAM SETUP ---
        const tele = window.Telegram.WebApp;
        tele.expand();
        const userID = tele.initDataUnsafe?.user?.id || "guest_123";
        const userName = tele.initDataUnsafe?.user?.first_name || "Player";

        let coins = 0; let energy = 500; let level = 1;

        // --- 3. DATA SYNC ---
        db.ref('users/' + userID).on('value', (snap) => {
            if(snap.exists()){
                const d = snap.val();
                coins = d.balance || 0;
                level = d.level || 1;
                updateUI();
            } else {
                db.ref('users/' + userID).set({ name: userName, balance: 1000, level: 1 });
            }
        });

        function updateUI() {
            document.getElementById("coin-count").innerText = Math.floor(coins).toLocaleString();
            document.getElementById("energy-val").innerText = energy;
            document.getElementById("bar-fill").style.width = (energy / 500) * 100 + "%";
            document.getElementById("user-name").innerText = "Hi, " + userName;
            document.getElementById("level-display").innerText = `Level: ${level} (+${level}/tap)`;
        }

        // --- 4. CORE FEATURES ---

        // Tapping
        document.getElementById("tap-btn").addEventListener("touchstart", (e) => {
            e.preventDefault();
            if(energy >= level) {
                coins += level; energy -= level;
                updateUI();
                db.ref('users/' + userID).update({ balance: coins });
            }
        });

        // Adsgram Integration
        function showAd() {
            if (AdController) {
                AdController.show().then(() => {
                    coins += 5000;
                    db.ref('users/' + userID).update({ balance: coins });
                    alert("Success! 5,000 BDC Reward added.");
                }).catch(() => alert("Ad not ready. Try again later."));
            }
        }

        // Tasks
        function doTask(url, reward, key) {
            tele.openLink(url);
            if(!localStorage.getItem('task_'+key)) {
                setTimeout(() => {
                    coins += reward;
                    db.ref('users/' + userID).update({ balance: coins });
                    localStorage.setItem('task_'+key, "done");
                    alert("Task Bonus Collected!");
                }, 5000);
            } else { alert("Already Completed!"); }
        }

        // Boost/Level
        function upgradeLevel() {
            let cost = level * 2000;
            if(coins >= cost) {
                coins -= cost; level++;
                db.ref('users/' + userID).update({ balance: coins, level: level });
                alert("Upgraded to Level " + level);
            } else { alert("Need " + cost + " BDC to upgrade!"); }
        }

        // Daily Bonus
        document.getElementById("daily-btn").onclick = () => {
            const last = localStorage.getItem("last_claim") || 0;
            const now = Date.now();
            if (now - last > 86400000) {
                coins += 1000;
                localStorage.setItem("last_claim", now);
                db.ref('users/' + userID).update({ balance: coins });
                alert("Daily 1,000 BDC received!");
            } else { alert("Wait 24 hours!"); }
        };

        function openPage(id) { document.getElementById(id).style.display = 'block'; }
        function closePages() { document.querySelectorAll('.overlay').forEach(p => p.style.display='none'); }

        function showReferral() {
            const link = `https://t.me/YourBotName?start=${userID}`;
            tele.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(link)}&text=Join BDC Network!`);
        }

        // Energy Recovery
        setInterval(() => { if(energy < 500) { energy++; updateUI(); } }, 2000);
    </script>
</body>
</html>
